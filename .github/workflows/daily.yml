name: Daily Stock News Report

on:
  schedule:
    # 三时段兜底：GitHub Actions 的 schedule 会漂移/跳过，多时段互为备份。
    # 01:00 UTC = 北京 09:00；04:30 UTC = 北京 12:30；12:00 UTC = 北京 20:00。
    - cron: '0 1 * * *'
    - cron: '30 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      # 公网一键刷新标识: 云端代理(SCF 云函数)传入的 runId,前端轮询 build-state.json
      # 用该值精确匹配"这一次"构建完成。定时构建无此 input → 写空串,不误配。
      run_id:
        description: 'Cloud refresh run id (internal)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # 防止双时段或手动触发并发跑导致 push 冲突/gh-pages 互相覆盖
  group: daily-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整 git 历史，构建产物提交回 main 时不会触发深层 clone 限制
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build daily report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          RUN_ID: ${{ github.event.inputs.run_id || '' }}
        run: node scripts/build-daily.mjs

      # 把构建产物（当日 history/ 存档 + 首页）提交回 main，让历史在 main 上
      # 永久累积。第二天 checkout 时能读到全部历史，跨构建累积自然生效；
      # 手动/定时构建也不会再互相覆盖历史。
      - name: Commit build artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history/ quality/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "日报自动构建: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: '.'
          publish_branch: gh-pages
          force_orphan: true

      # 国内镜像:EdgeOne Pages(腾讯,国内节点)。
      # 未配置 EDGEONE_API_TOKEN 前自动跳过,不影响 gh-pages 主部署。
      # 首次部署会自动创建 daily-stock-news 项目并分配默认免费域名。
      - name: Deploy to EdgeOne Pages (国内镜像)
        if: env.EDGEONE_PAGES_API_TOKEN != ''
        continue-on-error: true
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy . --name daily-stock-news --area global --json
